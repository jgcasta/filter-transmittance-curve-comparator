<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transmission Curve Comparator</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        color: #222;
    }

    header {
        background: #263238;
        color: white;
        padding: 18px 30px;
        font-size: 24px;
        font-weight: bold;
    }

    .container {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 20px;
        padding: 20px;
        height: calc(100vh - 65px);
    }

    .panel {
        background: white;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        overflow-y: auto;
    }

    .graph-panel {
        background: white;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        position: relative;
    }

    h2 {
        margin-top: 0;
        font-size: 18px;
    }

    #dropZone {
        border: 2px dashed #607d8b;
        border-radius: 8px;
        padding: 30px 15px;
        text-align: center;
        color: #546e7a;
        cursor: pointer;
        transition: 0.2s;
        margin-bottom: 20px;
    }

    #dropZone.dragover {
        background: #eceff1;
        border-color: #1976d2;
        color: #1976d2;
    }

    #fileInput {
        display: none;
    }

    select {
        width: 100%;
        min-height: 180px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        padding: 5px;
    }

    .buttons {
        display: flex;
        gap: 8px;
        margin-bottom: 15px;
    }

    button {
        border: none;
        border-radius: 5px;
        padding: 9px 12px;
        cursor: pointer;
        font-weight: bold;
    }

    .rename {
        background: #1976d2;
        color: white;
    }

    .delete {
        background: #d32f2f;
        color: white;
    }

    .clear {
        background: #546e7a;
        color: white;
    }

    button:hover {
        opacity: 0.88;
    }

    .info {
        font-size: 13px;
        color: #666;
        line-height: 1.5;
    }

    #chartContainer {
        width: 100%;
        height: 100%;
        min-height: 500px;
    }

    canvas {
        width: 100% !important;
        height: 100% !important;
    }

    .file-count {
        font-size: 13px;
        margin-bottom: 8px;
        color: #555;
    }

</style>
</head>

<body>

<header>
    Transmission Curve Comparator
</header>

<div class="container">

    <!-- PANEL IZQUIERDO -->
    <div class="panel">

        <h2>Available curves</h2>

        <div id="dropZone">
            Drag CSV files here
            <br><br>
            <strong>or click to select them</strong>
        </div>

        <input
            type="file"
            id="fileInput"
            accept=".csv,text/csv"
            multiple
        >

        <div id="fileCount" class="file-count">
            0 stored curves
        </div>

        <select id="curveSelector" multiple></select>

        <div class="buttons">
            <button class="rename" id="renameButton">
                Rename
            </button>

            <button class="delete" id="deleteButton">
                Delete
            </button>
        </div>

        <div class="buttons">
            <button class="clear" id="selectAllButton">
                Select all
            </button>

            <button class="clear" id="clearSelectionButton">
                Clear selection
            </button>
        </div>

        <div class="info">
            <strong>Expected CSV format:</strong>
            <br><br>
            Two numeric columns:
            <br>
            Wavelength, Transmission
            <br><br>
            Example:
            <br>
            400,0.12
            <br>
            450,0.45
            <br>
            500,0.82
            <br>
            550,0.95
        </div>

    </div>

    <!-- GRÁFICO -->
    <div class="graph-panel">

        <div id="chartContainer">
            <canvas id="transmissionChart"></canvas>
        </div>

    </div>

</div>


<script>

/* ==========================================================
   CONFIGURACIÓN
   ========================================================== */

const DB_NAME = "TransmissionCurveDB";
const DB_VERSION = 1;
const STORE_NAME = "curves";

let db;


/* ==========================================================
   COLORES
   ========================================================== */

const COLORS = [

    "#e6194b",
    "#3cb44b",
    "#4363d8",
    "#f58231",
    "#911eb4",
    "#46f0f0",
    "#f032e6",
    "#bcf60c",
    "#fabebe",
    "#008080",
    "#e6beff",
    "#9a6324",
    "#800000",
    "#808000",
    "#000075",
    "#808080"

];


/* ==========================================================
   ELEMENTOS HTML
   ========================================================== */

const dropZone =
    document.getElementById("dropZone");

const fileInput =
    document.getElementById("fileInput");

const curveSelector =
    document.getElementById("curveSelector");

const renameButton =
    document.getElementById("renameButton");

const deleteButton =
    document.getElementById("deleteButton");

const selectAllButton =
    document.getElementById("selectAllButton");

const clearSelectionButton =
    document.getElementById("clearSelectionButton");

const fileCount =
    document.getElementById("fileCount");


/* ==========================================================
   INDEXED DB
   ========================================================== */

function openDatabase() {

    const request =
        indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = function(event) {

        db = event.target.result;

        if (!db.objectStoreNames.contains(STORE_NAME)) {

            db.createObjectStore(
                STORE_NAME,
                {
                    keyPath: "id",
                    autoIncrement: true
                }
            );

        }

    };

    request.onsuccess = function(event) {

        db = event.target.result;

        loadCurveList();
        loadDataDirectory();

    };

    request.onerror = function(event) {

        console.error(
            "Error opening IndexedDB",
            event
        );

    };

}


/* ==========================================================
   GUARDAR CURVA
   ========================================================== */

function saveCurve(name, originalName, data) {

    const transaction =
        db.transaction(
            STORE_NAME,
            "readwrite"
        );

    const store =
        transaction.objectStore(STORE_NAME);

    store.add({

        name: name,

        originalName: originalName,

        data: data,

        created:
            new Date().toISOString()

    });

    transaction.oncomplete =
        loadCurveList;

}


/* ==========================================================
   CARGAR LISTADO
   ========================================================== */

function loadCurveList() {

    const transaction =
        db.transaction(
            STORE_NAME,
            "readonly"
        );

    const store =
        transaction.objectStore(STORE_NAME);

    const request =
        store.getAll();

    request.onsuccess = function() {

        const curves =
            request.result;

        curveSelector.innerHTML = "";

        curves.forEach(curve => {

            const option =
                document.createElement("option");

            option.value =
                curve.id;

            option.textContent =
                curve.name;

            curveSelector.appendChild(option);

        });

        fileCount.textContent =
            curves.length +
            (curves.length === 1
                ? " stored curve"
                : " stored curves");

        updateChart();

    };

}


/* ==========================================================
   PARSER CSV
   ========================================================== */

function parseCSV(text) {

    const lines =
        text
        .trim()
        .split(/\r?\n/);

    const data = [];

    for (let line of lines) {

        line = line.trim();

        if (!line)
            continue;

        /*
        Detectamos delimitador:
        coma
        punto y coma
        tabulador
        */

        let parts;

        if (line.includes(";")) {

            parts = line.split(";");

        }
        else if (line.includes("\t")) {

            parts = line.split("\t");

        }
        else {

            parts = line.split(",");

        }

        if (parts.length < 2)
            continue;

        let x =
            parseFloat(
                parts[0]
                .trim()
                .replace(",", ".")
            );

        let y =
            parseFloat(
                parts[1]
                .trim()
                .replace(",", ".")
            );

        /*
        Ignora automáticamente
        cabeceras no numéricas.
        */

        if (
            Number.isFinite(x) &&
            Number.isFinite(y)
        ) {

            data.push({
                x: x,
                y: y
            });

        }

    }

    /*
    Ordenamos por longitud
    de onda
    */

    data.sort(
        (a,b) => a.x - b.x
    );

    return data;

}


/* ==========================================================
   PROCESAR ARCHIVOS
   ========================================================== */

function processFiles(files) {

    Array.from(files)
        .forEach(file => {

            if (
                !file.name
                .toLowerCase()
                .endsWith(".csv")
            ) {

                return;

            }

            const reader =
                new FileReader();

            reader.onload =
                function(event) {

                    const text =
                        event.target.result;

                    const data =
                        parseCSV(text);

                    if (data.length === 0) {

                        alert(
                            "No valid data found in:\n" +
                            file.name
                        );

                        return;

                    }

                    /*
                    Quitamos extensión CSV
                    para usarla como nombre
                    inicial.
                    */

                    const displayName =
                        file.name
                        .replace(
                            /\.csv$/i,
                            ""
                        );

                    saveCurve(
                        displayName,
                        file.name,
                        data
                    );

                };

            reader.readAsText(file);

        });

}


/* ==========================================================
   DRAG & DROP
   ========================================================== */

dropZone.addEventListener(
    "click",
    () => fileInput.click()
);


fileInput.addEventListener(
    "change",
    event => {

        processFiles(
            event.target.files
        );

        fileInput.value = "";

    }
);


dropZone.addEventListener(
    "dragover",
    event => {

        event.preventDefault();

        dropZone.classList.add(
            "dragover"
        );

    }
);


dropZone.addEventListener(
    "dragleave",
    () => {

        dropZone.classList.remove(
            "dragover"
        );

    }
);


dropZone.addEventListener(
    "drop",
    event => {

        event.preventDefault();

        dropZone.classList.remove(
            "dragover"
        );

        processFiles(
            event.dataTransfer.files
        );

    }
);


/* ==========================================================
   GRÁFICO
   ========================================================== */

const ctx =
    document
    .getElementById(
        "transmissionChart"
    )
    .getContext("2d");


const chart =
    new Chart(
        ctx,
        {

            type: "line",

            data: {
                datasets: []
            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                parsing: false,

                animation: false,

                interaction: {

                    mode: "nearest",

                    intersect: false

                },

                plugins: {

                    legend: {

                        display: true,

                        position: "top"

                    },

                    title: {

                        display: true,

                        text:
                            "Transmission curves"

                    },

                    tooltip: {

                        callbacks: {

                            label:
                            function(context) {

                                return (
                                    context.dataset.label +
                                    ": " +
                                    context.parsed.x +
                                    " nm, " +
                                    context.parsed.y
                                );

                            }

                        }

                    }

                },

                scales: {

                    x: {

                        type: "linear",

                        title: {

                            display: true,

                            text:
                                "Wavelength (nm)"

                        }

                    },

                    y: {

                        title: {

                            display: true,

                            text:
                                "Transmission (%)"

                        }

                    }

                }

            }

        }
    );


/* ==========================================================
   ACTUALIZAR GRÁFICO
   ========================================================== */

/* ==========================================================
   INTERPOLACIÓN Y TRANSMITANCIA TOTAL
   T_total(lambda) = producto_i T_i(lambda)

   IMPORTANTE:
   Todas las transmitancias se consideran expresadas entre
   0 y 100. Para multiplicarlas se convierten temporalmente
   a 0..1 y el resultado vuelve a expresarse en porcentaje:

   T_total(%) = 100 * producto_i [ T_i(%) / 100 ]
   ========================================================== */

function interpolateTransmission(data, wavelength) {

    if (!data || data.length < 2)
        return null;

    if (
        wavelength < data[0].x ||
        wavelength > data[data.length - 1].x
    ) {
        return null;
    }

    /* Búsqueda binaria de los dos puntos que rodean lambda. */
    let low = 0;
    let high = data.length - 1;

    while (high - low > 1) {

        const middle =
            Math.floor((low + high) / 2);

        if (data[middle].x <= wavelength)
            low = middle;
        else
            high = middle;

    }

    const p1 = data[low];
    const p2 = data[high];

    if (wavelength === p1.x)
        return p1.y;

    if (wavelength === p2.x)
        return p2.y;

    if (p2.x === p1.x)
        return p1.y;

    /* Interpolación lineal. */
    return p1.y +
        (p2.y - p1.y) *
        (wavelength - p1.x) /
        (p2.x - p1.x);
}


function calculateTotalTransmission(curves) {

    if (curves.length < 2)
        return [];

    /*
       Solo calculamos donde TODAS las curvas tienen datos.
       Esto evita extrapolar fuera del intervalo medido.
    */
    const minWavelength =
        Math.max(
            ...curves.map(
                curve => curve.data[0].x
            )
        );

    const maxWavelength =
        Math.min(
            ...curves.map(
                curve =>
                    curve.data[
                        curve.data.length - 1
                    ].x
            )
        );

    if (minWavelength > maxWavelength)
        return [];

    /*
       Malla espectral común: unión de todas las longitudes
       de onda existentes dentro del intervalo compartido.
       Las curvas que no tengan un punto exactamente en lambda
       se interpolan linealmente.
    */
    const wavelengths =
        Array.from(
            new Set(
                curves.flatMap(
                    curve =>
                        curve.data
                            .filter(
                                point =>
                                    point.x >= minWavelength &&
                                    point.x <= maxWavelength
                            )
                            .map(point => point.x)
                )
            )
        )
        .sort((a, b) => a - b);

    const totalData = [];

    wavelengths.forEach(wavelength => {

        let totalFraction = 1;
        let valid = true;

        for (const curve of curves) {

            const transmission =
                interpolateTransmission(
                    curve.data,
                    wavelength
                );

            if (!Number.isFinite(transmission)) {
                valid = false;
                break;
            }

            /*
               Entrada: 0..100 %
               Conversión: porcentaje -> fracción 0..1
            */
            const fraction =
                Math.max(
                    0,
                    Math.min(100, transmission)
                ) / 100;

            totalFraction *= fraction;
        }

        if (valid) {

            totalData.push({
                x: wavelength,
                y: totalFraction * 100
            });

        }

    });

    return totalData;
}


/* ==========================================================
   ACTUALIZAR GRÁFICO
   ========================================================== */

function updateChart() {

    const selectedIDs =
        Array.from(
            curveSelector.selectedOptions
        )
        .map(
            option =>
                Number(option.value)
        );

    if (selectedIDs.length === 0) {

        chart.data.datasets = [];
        chart.update();
        return;

    }

    const transaction =
        db.transaction(
            STORE_NAME,
            "readonly"
        );

    const store =
        transaction.objectStore(
            STORE_NAME
        );

    /*
       Guardamos cada curva en su posición original para que
       el orden y los colores coincidan con la selección.
    */
    const selectedCurves =
        new Array(selectedIDs.length);

    let completed = 0;

    selectedIDs.forEach(
        (id, index) => {

            const request =
                store.get(id);

            request.onsuccess =
                function() {

                    selectedCurves[index] =
                        request.result || null;

                    completed++;

                    if (
                        completed ===
                        selectedIDs.length
                    ) {

                        const validCurves =
                            selectedCurves.filter(Boolean);

                        const datasets = [];

                        validCurves.forEach(
                            (curve, index) => {

                                const color =
                                    COLORS[
                                        index %
                                        COLORS.length
                                    ];

                                datasets.push({

                                    label:
                                        curve.name,

                                    data:
                                        curve.data,

                                    borderColor:
                                        color,

                                    backgroundColor:
                                        color,

                                    borderWidth: 2,

                                    pointRadius: 0,

                                    pointHoverRadius: 4,

                                    tension: 0

                                });

                            }
                        );

                        /*
                           Si hay dos o más curvas seleccionadas,
                           calculamos:

                           T_total(lambda) = producto_i T_i(lambda)

                           con resultado final entre 0 y 100 %.
                        */
                        if (validCurves.length > 1) {

                            const totalData =
                                calculateTotalTransmission(
                                    validCurves
                                );

                            if (totalData.length > 0) {

                                datasets.push({

                                    label:
                                        "Total transmission",

                                    data:
                                        totalData,

                                    borderColor:
                                        "#000000",

                                    backgroundColor:
                                        "#000000",

                                    borderWidth: 3,

                                    borderDash:
                                        [8, 5],

                                    pointRadius: 0,

                                    pointHoverRadius: 5,

                                    tension: 0

                                });

                            }

                        }

                        chart.data.datasets =
                            datasets;

                        /* Escala porcentual solicitada. */
                        chart.options.scales.y.min = 0;
                        chart.options.scales.y.max = 100;

                        chart.update();

                    }

                };

        }
    );

}


/* ==========================================================
   SELECCIÓN
   ========================================================== */

curveSelector.addEventListener(
    "change",
    updateChart
);


/* ==========================================================
   RENOMBRAR
   ========================================================== */

renameButton.addEventListener(
    "click",
    function() {

        const selected =
            curveSelector
            .selectedOptions;

        if (
            selected.length !== 1
        ) {

            alert(
                "Select exactly one curve to rename it."
            );

            return;

        }

        const option =
            selected[0];

        const id =
            Number(option.value);

        const newName =
            prompt(
                "New name:",
                option.textContent
            );

        if (
            !newName ||
            !newName.trim()
        )
            return;

        const transaction =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );

        const store =
            transaction.objectStore(
                STORE_NAME
            );

        const request =
            store.get(id);

        request.onsuccess =
            function() {

                const curve =
                    request.result;

                curve.name =
                    newName.trim();

                store.put(curve);

            };

        transaction.oncomplete =
            loadCurveList;

    }
);


/* ==========================================================
   ELIMINAR
   ========================================================== */

deleteButton.addEventListener(
    "click",
    function() {

        const selected =
            Array.from(
                curveSelector
                .selectedOptions
            );

        if (
            selected.length === 0
        ) {

            alert(
                "Select at least one curve."
            );

            return;

        }

        const names =
            selected
            .map(
                option =>
                    option.textContent
            )
            .join("\n");

        if (
            !confirm(
                "Delete the following curves?\n\n" +
                names
            )
        ) {

            return;

        }

        const transaction =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );

        const store =
            transaction.objectStore(
                STORE_NAME
            );

        selected.forEach(
            option => {

                store.delete(
                    Number(
                        option.value
                    )
                );

            }
        );

        transaction.oncomplete =
            loadCurveList;

    }
);


/* ==========================================================
   SELECCIONAR TODAS
   ========================================================== */

selectAllButton.addEventListener(
    "click",
    function() {

        Array.from(
            curveSelector.options
        )
        .forEach(
            option =>
                option.selected = true
        );

        updateChart();

    }
);


/* ==========================================================
   LIMPIAR SELECCIÓN
   ========================================================== */

clearSelectionButton.addEventListener(
    "click",
    function() {

        Array.from(
            curveSelector.options
        )
        .forEach(
            option =>
                option.selected = false
        );

        updateChart();

    }
);



/* ==========================================================
   CARGA AUTOMÁTICA DE TODOS LOS CSV DE /data
   Requiere el servidor local servidor.py.
   Sin duplicados: cada fichero se identifica por sourcePath.
   ========================================================== */
async function loadDataDirectory() {
    const count = document.getElementById("fileCount");
    try {
        const response = await fetch("/api/data-files", {cache:"no-store"});
        if (!response.ok) throw new Error("HTTP " + response.status);
        const filenames = await response.json();
        if (!Array.isArray(filenames)) throw new Error("Invalid file list");

        const readAll = () => new Promise((resolve, reject) => {
            const request = db.transaction(STORE_NAME,"readonly")
                              .objectStore(STORE_NAME).getAll();
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
        const existing = await readAll();
        let imported = 0, updated = 0, errors = [];
        for (const filename of filenames) {
            try {
                const url = "/data/" + filename.split("/").map(encodeURIComponent).join("/");
                const res = await fetch(url, {cache:"no-store"});
                if (!res.ok) throw new Error("HTTP " + res.status);
                const csv = await res.text();
                const data = parseCSV(csv);
                if (data.length < 2) throw new Error("CSV has insufficient data");
                const old = existing.find(c => c.sourcePath === filename);
                const curve = old ? {...old, data, originalName: filename} : {
                    name: filename.replace(/\.csv$/i,""),
                    originalName: filename,
                    sourcePath: filename,
                    data,
                    created: new Date().toISOString()
                };
                await new Promise((resolve,reject) => {
                    const request = db.transaction(STORE_NAME,"readwrite")
                                      .objectStore(STORE_NAME).put(curve);
                    request.onsuccess = resolve;
                    request.onerror = () => reject(request.error);
                });
                if (old) updated++; else imported++;
            } catch (e) { errors.push(filename + ": " + e.message); }
        }
        // Preservar la selección actual al actualizar la lista.
        const selected = new Set(Array.from(curveSelector.selectedOptions, o => String(o.value)));
        loadCurveList();
        // loadCurveList es asíncrona; restauramos la selección al completar el DOM.
        // Se deja sin selección en el primer arranque, igual que la versión original.
        console.info(`CSVs in data/: ${imported} added, ${updated} updated.`, errors);
        if (errors.length) console.warn("CSVs not imported:", errors);
    } catch(e) {
        console.warn("Automatic loading unavailable. Start the application using server.py.",e);
    }
}

/* ==========================================================
   INICIO
   ========================================================== */

openDatabase();

</script>

</body>
</html>
